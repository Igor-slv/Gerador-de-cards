<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de textos para cards</title>
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--mut:#5c5c66;--card:#f3f4f8;--line:#d6d8e0;--ac:#1d4ed8;--acfg:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#ececf1;--mut:#a3a5b0;--card:#202229;--line:#33363f;--ac:#6b8cff;--acfg:#0b0c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#ececf1;--mut:#a3a5b0;--card:#202229;--line:#33363f;--ac:#6b8cff;--acfg:#0b0c10;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
button{padding:11px 18px;border:0;border-radius:8px;background:var(--ac);color:var(--acfg);font:inherit;font-weight:600;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:10px;padding:7px 12px}
.msg{margin-top:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.cardx small{color:var(--mut)}
.cardx h3{margin:4px 0 6px;font-size:1.05rem}
.cardx p{margin:0}
.leg{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.leg p{margin:6px 0 0;white-space:pre-wrap}
.aviso{margin-top:12px;color:#b45309}
</style>
</head>
<body>
<main>
  <h1>Gerador de textos para cards</h1>
  <p class="sub">Descreva o tema e receba uma sugestão de textos para um carrossel de Instagram.</p>

  <label for="tema">Tema ou pauta</label>
  <textarea id="tema" placeholder="Ex.: Dia Mundial da Língua Portuguesa: curiosidades sobre o idioma"></textarea>

  <div class="row">
    <div>
      <label for="tom">Tom</label>
      <select id="tom">
        <option>institucional</option>
        <option>informativo</option>
        <option>acolhedor</option>
        <option>descontraído</option>
      </select>
    </div>
    <div>
      <label for="qtd">Quantidade de cards</label>
      <select id="qtd">
        <option>1</option>
        <option selected>3</option>
        <option>5</option>
      </select>
    </div>
  </div>

  <button id="btn">Gerar textos</button>
  <p id="aviso" class="aviso" hidden>Este recurso de IA só funciona dentro do Claude. Abra o link por lá.</p>
  <p id="msg" class="msg" aria-live="polite"></p>
  <div id="saida"></div>
</main>

<script>
// 1) Atalho para pegar elementos da página pelo id
const $ = (id) => document.getElementById(id);

// 2) Pedimos acesso à IA. Se não houver, "ia" fica null e avisamos a pessoa.
let ia = null;
if (window.claude && window.claude.use) {
  window.claude.use("sample").then((s) => {
    ia = s;
    if (!s) $("aviso").hidden = false;
  }).catch(() => { $("aviso").hidden = false; });
} else {
  $("aviso").hidden = false;
}

// 3) Monta o pedido (prompt) com o que a pessoa escolheu
function montarPrompt(tema, tom, qtd) {
  return "Você é um assistente de comunicação para redes sociais institucionais. " +
    "Tema: " + tema + ". Tom: " + tom + ". " +
    "Crie " + qtd + " card(s) para um carrossel de Instagram. " +
    "Responda SOMENTE com JSON no formato " +
    '{"cards":[{"titulo":"...","texto":"..."}],"legenda":"..."}. ' +
    "Regras: título com até 6 palavras; texto com até 25 palavras; " +
    "legenda com até 40 palavras e 3 hashtags; português do Brasil; " +
    "não invente dados, datas ou nomes; se faltar informação, escreva [confirmar].";
}

// 4) Mostra o resultado na tela (textContent evita inserir HTML por engano)
function mostrar(dados) {
  const saida = $("saida");
  saida.textContent = "";

  const grade = document.createElement("div");
  grade.className = "grid";
  (dados.cards || []).forEach((c, i) => {
    const caixa = document.createElement("div");
    caixa.className = "cardx";
    const n = document.createElement("small");
    n.textContent = "Card " + (i + 1);
    const t = document.createElement("h3");
    t.textContent = c.titulo || "";
    const p = document.createElement("p");
    p.textContent = c.texto || "";
    caixa.append(n, t, p);
    grade.append(caixa);
  });
  saida.append(grade);

  const leg = document.createElement("div");
  leg.className = "leg";
  const lt = document.createElement("strong");
  lt.textContent = "Legenda sugerida";
  const lp = document.createElement("p");
  lp.textContent = dados.legenda || "";
  const copiar = document.createElement("button");
  copiar.className = "sec";
  copiar.textContent = "Copiar legenda";
  copiar.onclick = async () => {
    try {
      await navigator.clipboard.writeText(lp.textContent);
      copiar.textContent = "Copiado";
    } catch (e) {
      copiar.textContent = "Não foi possível copiar";
    }
  };
  leg.append(lt, lp, copiar);
  saida.append(leg);
}

// 5) Quando clica no botão: valida, chama a IA, mostra o resultado
$("btn").onclick = async () => {
  const tema = $("tema").value.trim();
  if (!tema) { $("msg").textContent = "Escreva um tema primeiro."; return; }
  if (!ia) { $("aviso").hidden = false; return; }

  $("btn").disabled = true;
  $("msg").textContent = "Gerando…";
  try {
    const dados = await ia.json(montarPrompt(tema, $("tom").value, $("qtd").value));
    mostrar(dados);
    $("msg").textContent = "Revise os textos antes de usar: a IA pode errar.";
  } catch (e) {
    $("msg").textContent = (e && e.code === "rate_limited")
      ? "Muitas tentativas seguidas. Aguarde um pouco."
      : "Não consegui gerar agora. Tente de novo.";
  } finally {
    $("btn").disabled = false;
  }
};
</script>
</body>
</html>
